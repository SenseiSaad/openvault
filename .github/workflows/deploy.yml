name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build-push:
    name: Build once and push immutable SHA images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN }}
          role-session-name: openvault-image-build
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build API image once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: openvault-api:${{ github.sha }}
      - name: Build web image once (same-origin API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: openvault-web:${{ github.sha }}
      - name: Tag and push the immutable images to available environments
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_API_REPOSITORY_STAGING: ${{ vars.ECR_API_REPOSITORY_STAGING }}
          ECR_WEB_REPOSITORY_STAGING: ${{ vars.ECR_WEB_REPOSITORY_STAGING }}
          ECR_API_REPOSITORY_PROD: ${{ vars.ECR_API_REPOSITORY_PROD }}
          ECR_WEB_REPOSITORY_PROD: ${{ vars.ECR_WEB_REPOSITORY_PROD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$ECR_API_REPOSITORY_STAGING" && -n "$ECR_WEB_REPOSITORY_STAGING" ]] || {
            echo "Staging ECR repositories are not configured; run setup_github.sh staging." >&2
            exit 1
          }
          for env_name in staging prod; do
            if [[ "$env_name" == staging ]]; then
              api_repo="$ECR_API_REPOSITORY_STAGING"
              web_repo="$ECR_WEB_REPOSITORY_STAGING"
            else
              api_repo="$ECR_API_REPOSITORY_PROD"
              web_repo="$ECR_WEB_REPOSITORY_PROD"
              [[ -n "$api_repo" && -n "$web_repo" ]] || continue
            fi
            docker tag "openvault-api:$IMAGE_TAG" "$ECR_REGISTRY/$api_repo:$IMAGE_TAG"
            docker tag "openvault-web:$IMAGE_TAG" "$ECR_REGISTRY/$web_repo:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$api_repo:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$web_repo:$IMAGE_TAG"
          done

  staging:
    name: Deploy staging
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_SERVICE: ${{ vars.ECS_API_SERVICE }}
      WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
      WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      ALLOW_EMAIL_VERIFICATION_BYPASS: ${{ vars.ALLOW_EMAIL_VERIFICATION_BYPASS }}
      SMOKE_TEST_MODE: ${{ vars.SMOKE_TEST_MODE }}
      REQUIRE_AUTH_SMOKE: "0"
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          role-session-name: openvault-deploy-staging
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy, migrate, wait, and smoke-test
        run: ./scripts/deploy_ecs.sh staging "${{ needs.build-push.outputs.image_tag }}"

  production:
    name: Deploy production (required reviewer)
    needs: [build-push, staging]
    if: ${{ needs.staging.result == 'success' && vars.PROD_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_SERVICE: ${{ vars.ECS_API_SERVICE }}
      WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
      WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      REQUIRE_AUTH_SMOKE: "1"
      ALLOW_EMAIL_VERIFICATION_BYPASS: "0"
      SMOKE_TEST_MODE: ${{ vars.SMOKE_TEST_MODE }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          role-session-name: openvault-deploy-production
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy, migrate, wait, and smoke-test
        run: ./scripts/deploy_ecs.sh prod "${{ needs.build-push.outputs.image_tag }}"
