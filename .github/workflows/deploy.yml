name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  build-push:
    name: Build + push images (tag = commit SHA)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build + push backend
        run: |
          REG=${{ vars.ECR_REGISTRY }}
          docker build -f backend/Dockerfile -t $REG/openvault-api:${{ steps.tag.outputs.tag }} .
          docker push $REG/openvault-api:${{ steps.tag.outputs.tag }}
      - name: Build + push web
        run: |
          REG=${{ vars.ECR_REGISTRY }}
          docker build -f frontend/Dockerfile -t $REG/openvault-web:${{ steps.tag.outputs.tag }} .
          docker push $REG/openvault-web:${{ steps.tag.outputs.tag }}

  migrate:
    name: Run migration one-off task
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Register + run migrate task with the new image
        run: |
          REG=${{ vars.ECR_REGISTRY }}
          TAG=${{ needs.build-push.outputs.tag }}
          # Render the migrate task def with the new image and run it to completion.
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition openvault-prod-migrate \
            --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$TASK_DEF" | jq \
            --arg image "$REG/openvault-api:$TAG" \
            '.containerDefinitions[0].image = $image |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy)')
          REV=$(echo "$NEW_DEF" | aws ecs register-task-definition \
            --cli-input-json file://<(echo "$NEW_DEF") \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          RUN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$REV" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(aws ssm get-parameter --name /openvault/deploy/subnets --query Parameter.Value --output text)],securityGroups=[$(aws ssm get-parameter --name /openvault/deploy/api-sg --query Parameter.Value --output text)],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Waiting for migrate task $RUN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$RUN"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$RUN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT" != "0" ]; then
            echo "Migration FAILED (exit $EXIT)"; exit 1
          fi

  deploy-staging:
    name: Deploy staging
    needs: [build-push, migrate]
    if: vars.STAGING_CLUSTER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update staging services
        run: |
          aws ecs update-service --cluster "$STAGING_CLUSTER" --service api \
            --task-definition openvault-stg-api \
            --force-new-deployment || true
          echo "Staging deploy: register a new task def revision per image at deploy time (see docs/DEPLOY.md)."

  deploy-production:
    name: Deploy production (manual approval)
    needs: [build-push, migrate]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Render + register task defs with the new image tag
        run: |
          REG=${{ vars.ECR_REGISTRY }}
          TAG=${{ needs.build-push.outputs.tag }}
          for FAMILY in openvault-prod-api openvault-prod-worker; do
            aws ecs describe-task-definition --task-definition "$FAMILY" \
              --query 'taskDefinition' --output json | jq \
              --arg image "$REG/openvault-api:$TAG" \
              '.containerDefinitions[0].image = $image |
               del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)' > /tmp/def.json
            aws ecs register-task-definition \
              --cli-input-json file:///tmp/def.json \
              --query 'taskDefinition.taskDefinitionArn' --output text
          done
          for FAMILY in openvault-prod-web; do
            aws ecs describe-task-definition --task-definition "$FAMILY" \
              --query 'taskDefinition' --output json | jq \
              --arg image "$REG/openvault-web:$TAG" \
              '.containerDefinitions[0].image = $image |
               del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)' > /tmp/def.json
            aws ecs register-task-definition \
              --cli-input-json file:///tmp/def.json \
              --query 'taskDefinition.taskDefinitionArn' --output text
          done
      - name: Update services and wait for stability
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service api \
            --task-definition openvault-prod-api --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service worker \
            --task-definition openvault-prod-worker --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service web \
            --task-definition openvault-prod-web --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services api worker web
      - name: Smoke test
        run: |
          BASE=https://${{ vars.PROD_DOMAIN }}
          curl -fsS "$BASE/api/health/live" | grep -q '"status":"ok"'
          curl -fsS "$BASE/api/health" | grep -q '"status":"ok"'
          curl -fsS -o /dev/null -w "%{http_code}" "$BASE/" | grep -q "200"
      - name: Rollback on failed smoke test
        if: failure()
        run: |
          echo "Smoke test failed — redeploying previous image tag"
          PREV=$(aws ecs describe-task-definition \
            --task-definition openvault-prod-api \
            --query 'taskDefinition' --output json | jq -r '.revision - 1')
          aws ecs update-service --cluster "$CLUSTER" --service api \
            --task-definition "openvault-prod-api:$PREV"
