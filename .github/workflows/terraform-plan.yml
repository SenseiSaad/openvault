name: Terraform plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Plan ${{ matrix.github_environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - github_environment: staging
            tf_dir: staging
          - github_environment: production
            tf_dir: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: ${{ matrix.tf_dir }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain: ${{ matrix.github_environment == 'staging' && vars.DOMAIN_STAGING || vars.DOMAIN_PROD }}
      TF_VAR_from_email: ${{ matrix.github_environment == 'staging' && vars.FROM_EMAIL_STAGING || vars.FROM_EMAIL_PROD }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_github_repo: ${{ vars.REPOSITORY }}
      TF_VAR_bedrock_model_arns: ${{ vars.BEDROCK_MODEL_ARNS }}
      TF_VAR_dmarc_record: ${{ vars.DMARC_RECORD }}
      TF_VAR_services_enabled: "true"
      TF_VAR_initial_image_tag: ${{ vars.INITIAL_IMAGE_TAG }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.tf_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: openvault-plan-${{ matrix.github_environment }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Initialize remote state
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=envs/$TF_DIR/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
            -backend-config="encrypt=true"
      - name: Create read-only plan
        run: terraform plan -lock=false -input=false -no-color -out=tfplan
      - name: Render plan for pull request
        run: terraform show -no-color tfplan > plan.txt
      - name: Post plan as PR comment
        uses: actions/github-script@v7
        env:
          PLAN_ENV: ${{ matrix.github_environment }}
          PLAN_FILE: infra/envs/${{ matrix.tf_dir }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const clipped = text.length > 60000 ? text.slice(0, 60000) + '\n… truncated' : text;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Terraform plan — ${process.env.PLAN_ENV}\n\n\`\`\`hcl\n${clipped}\n\`\`\``
            });
