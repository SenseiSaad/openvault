name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: OpenVault API (lint + tests + security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Django system check
        run: python manage.py check
      - name: Production settings check
        run: python manage.py check
        env:
          ENVIRONMENT: production
          DEBUG: "false"
          COOKIE_SECURE: "true"
          SECURE_SSL_REDIRECT: "true"
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          CSRF_TRUSTED_ORIGINS: http://localhost:3000
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite with coverage (gate 70% on core/)
        run: python -m pytest --cov=core --cov-fail-under=70
      - name: Bandit (static analysis)
        run: bandit -r core config -ll
      - name: pip-audit (known CVEs)
        run: pip-audit -r requirements.txt --strict
      - name: gitleaks (no committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --no-banner

  frontend:
    name: OpenVault web (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build (standalone Docker server)
        run: pnpm build
        env:
          DOCKER_STANDALONE: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000

  images:
    name: Build + scan Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t openvault-api:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t openvault-web:ci .
      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: openvault-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # report-only until baseline is clean; flip to "1"
      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: openvault-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  terraform:
    name: Terraform fmt + validate + tflint + checkov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: terraform fmt
        run: terraform fmt -recursive -check
      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init && tflint --recursive --format compact
      - name: checkov (documented exceptions in .checkov.yml)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          framework: terraform
          config_file: infra/.checkov.yml
          soft_fail: false
      - name: terraform validate (per config)
        run: |
          for d in bootstrap modules/* envs/prod envs/staging; do
            (cd "$d" && terraform init -backend=false -input=false >/dev/null 2>&1 && terraform validate) || exit 1
          done

  ci-required:
    name: CI required
    if: always()
    needs: [backend, frontend, images, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$IMAGES_RESULT" "$TERRAFORM_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
