name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Bandit (static analysis)
        run: bandit -r core config -ll
      - name: pip-audit (known CVEs)
        run: pip-audit -r requirements.txt --strict

  backend:
    name: OpenVault API (checks + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Django system check
        run: python manage.py check
      - name: Production settings check
        run: python manage.py check
        env:
          ENVIRONMENT: production
          DEBUG: "false"
          COOKIE_SECURE: "true"
          SECURE_SSL_REDIRECT: "true"
          ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Run test suite
        run: python -m pytest

  frontend:
    name: OpenVault web (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build (standalone Docker server)
        run: pnpm build
        env:
          DOCKER_STANDALONE: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Static export (AWS Amplify)
        run: |
          rm -rf .next out
          DOCKER_STANDALONE=false NEXT_PUBLIC_API_URL=https://api.saadops.site pnpm build
          test -f out/index.html
          test -f out/infrastructure/index.html
