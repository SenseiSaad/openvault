name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment root to apply"
        required: true
        type: choice
        options: [staging, prod]

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: terraform apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'terraform-prod' || 'terraform-staging' }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    env:
      TF_VAR_domain: ${{ vars.TF_VAR_DOMAIN }}
      TF_VAR_bedrock_model_arns: ${{ vars.BEDROCK_MODEL_ARNS }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color
      - run: terraform apply -input=false -auto-approve
