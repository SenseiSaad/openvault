name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: "Previously pushed immutable commit SHA"
        required: true
        type: string

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    name: Roll back ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_SERVICE: ${{ vars.ECS_API_SERVICE }}
      WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
      WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      SKIP_MIGRATE: "1"
      REQUIRE_AUTH_SMOKE: ${{ inputs.environment == 'production' && '1' || '0' }}
      ALLOW_EMAIL_VERIFICATION_BYPASS: ${{ inputs.environment == 'staging' && vars.ALLOW_EMAIL_VERIFICATION_BYPASS || '0' }}
      SMOKE_TEST_MODE: ${{ vars.SMOKE_TEST_MODE }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          role-session-name: openvault-rollback-${{ inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Redeploy the previous immutable image (skip migrations)
        run: |
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            ./scripts/deploy_ecs.sh prod "${{ inputs.image_tag }}"
          else
            ./scripts/deploy_ecs.sh staging "${{ inputs.image_tag }}"
          fi
