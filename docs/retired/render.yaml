# Current launch: AWS Amplify serves the frontend; Render runs Django,
# PostgreSQL, and persistent uploads. AWS-native ECS/ECR is a future migration.
#
# The PostgreSQL instance already exists in Render. Attach it to the web
# service by setting DATABASE_URL to the database's internal connection string
# in the Render Dashboard (or enter it when Render prompts during Blueprint
# creation). Never commit the connection string or password.
services:
  - type: web
    name: openvault-api
    runtime: docker
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: openvault-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_KEY_ENCRYPTION_KEY
        generateValue: true
      - key: BOOTSTRAP_PLATFORM_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: 'false'
      - key: ALLOW_INSECURE_HTTP
        value: 'false'
      - key: COOKIE_SECURE
        value: 'true'
      - key: SECURE_SSL_REDIRECT
        value: 'true'
      - key: ALLOWED_HOSTS
        value: api.saadops.site,localhost,127.0.0.1,openvault-api
      - key: CORS_ALLOWED_ORIGINS
        value: https://openvault.saadops.site
      - key: CSRF_TRUSTED_ORIGINS
        value: https://openvault.saadops.site,https://api.saadops.site
      - key: PUBLIC_BASE_URL
        value: https://openvault.saadops.site
      - key: DATA_DIR
        value: /var/data/documents
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: GUNICORN_WORKERS
        value: '1'
      - key: GUNICORN_THREADS
        value: '2'
      - key: REQUIRE_EMAIL_VERIFICATION
        value: 'true'
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: email-smtp.ap-south-1.amazonaws.com
      - key: EMAIL_PORT
        value: '587'
      - key: EMAIL_USE_TLS
        value: 'true'
      - key: DEFAULT_FROM_EMAIL
        value: OpenVault <no-reply@saadops.site>
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: bedrock
      - key: BEDROCK_MODEL
        value: in.anthropic.claude-haiku-4-5-20251001-v1:0
      - key: BEDROCK_REGION
        value: ap-south-1
      - key: BEDROCK_EMBED_MODEL
        value: amazon.titan-embed-text-v2:0
      - key: EMBED_PROVIDER
        value: bedrock
      - key: BEDROCK_API_KEY
        sync: false
