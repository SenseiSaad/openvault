# Accepted checkov exceptions. Each entry documents WHY it is accepted, not
# ignored. Revisit at the first real-customer review.
skip-check:
  # Public-subnet design (no NAT): ECS tasks get public IPs, egress via IGW.
  # Deliberate — ADR 0004. RDS/Redis remain in isolated private subnets.
  - CKV_AWS_130   # subnets map_public_ip_on_launch
  - CKV_AWS_333   # ECS tasks assign_public_ip
  - CKV_AWS_382   # SG egress 0.0.0.0/0 (AWS service APIs have no fixed CIDRs)
  - CKV2_AWS_5    # SG attachments flow through variables; graph check can't see them
  # Encryption: CloudWatch encrypts at rest with AWS-owned keys; S3/ECR use
  # AWS-managed KMS keys where supported. Per-resource customer KMS deferred.
  - CKV_AWS_158   # log group KMS
  - CKV_AWS_145   # S3 KMS (SSE-KMS with aws/s3 applied — checker wants explicit customer key)
  - CKV_AWS_119   # S3 KMS
  - CKV_AWS_118   # ECR KMS
  # Replication / HA upgrades deferred until real customers (documented in ADR 0002)
  - CKV_AWS_144   # S3 cross-region replication
  - CKV_AWS_260   # replication group Multi-AZ (single node by design at this stage)
  - CKV_AWS_161   # RDS Multi-AZ (variable-gated; enabled when real traffic exists)
  - CKV_AWS_293   # staging RDS deletion protection is intentionally OFF so staging can be destroyed
  - CKV_AWS_157   # RDS tiered storage
  - CKV_AWS_129   # RDS logging (CloudWatch export; app logs cover launch stage)
  - CKV_AWS_353   # RDS Performance Insights (cost; enable with real traffic)
  # Log/audit niceties deferred with the same review checkpoint
  - CKV_AWS_18    # access-logs/state buckets cannot usefully log to themselves; inline skip not honored by this version
  - CKV_AWS_50    # x-ray
  - CKV_AWS_288   # ASG eager scaling signals
  - CKV2_AWS_61   # S3 lifecycle for abort-incomplete (present on main buckets; template quirk)
  - CKV2_AWS_62   # S3 event notifications (no event consumers yet)
  - CKV2_AWS_28   # S3 event notifications variant
  # Data-source pinning: AZ set is pinned by subnet count, not by the data source
