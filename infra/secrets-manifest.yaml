# Names only — never put values in this file.
#
# `scripts/push_env_to_ssm.sh` pushes the required/optional secrets below to
#   /openvault/<env>/<NAME>
# as SSM SecureString parameters. Terraform's ECS task definitions reference
# those parameter ARNs; the app never receives them from a committed file.
#
# `scripts/check_env.sh` validates the same list before you push.

required_secrets:
  - SECRET_KEY
  - DATABASE_URL
  - LLM_KEY_ENCRYPTION_KEY
  - EMAIL_HOST_USER
  - EMAIL_HOST_PASSWORD
  - BOOTSTRAP_PLATFORM_ADMIN_EMAIL
  - BOOTSTRAP_PLATFORM_ADMIN_PASSWORD

optional_secrets:
  - SENTRY_DSN

# These are set by Terraform (plain ECS environment values) and should NOT be
# duplicated in .env.production. Listed so the manifest is a complete inventory.
terraform_managed:
  - ALLOWED_HOSTS
  - CORS_ALLOWED_ORIGINS
  - CSRF_TRUSTED_ORIGINS
  - PUBLIC_BASE_URL
  - COOKIE_SECURE
  - ENVIRONMENT
  - REQUIRE_EMAIL_VERIFICATION
  - TRUSTED_PROXY_COUNT
  - LLM_PROVIDER
  - BEDROCK_REGION
  - BEDROCK_MODEL
  - BEDROCK_EMBED_MODEL
  - EMBED_PROVIDER
  - EMBED_DIM
  - CACHE_URL
  - CELERY_BROKER_URL
  - DEFAULT_FROM_EMAIL
  - EMAIL_HOST
  - EMAIL_PORT
  - EMAIL_USE_TLS
  - DATA_DIR
  - MEDIA_ROOT
  - AWS_STORAGE_BUCKET_NAME
  - AWS_S3_REGION_NAME
  - ATTENDANCE_QR_REQUIRED
  - LOG_FORMAT

# Optional, and intentionally blank on ECS. The task role is the credential
# source; a bearer token here would bypass the IAM design.
optional_plain:
  - BEDROCK_API_KEY
