# Classification of every app variable for the ECS deployment.
# secret: true  -> SSM SecureString, pushed via scripts/push_env_to_ssm.sh
# secret: false -> plain String (or baked into Terraform app_environment)
# Terraform NEVER creates secret VALUES — only IAM permissions and the
# parameter names that task definitions reference.
secrets:          # SSM SecureString
  - name: SECRET_KEY
    description: Django signing key (JWT cookies, admin sessions). Rotate = all sessions invalidated.
    generate: python -c "import secrets; print(secrets.token_urlsafe(50))"
  - name: DATABASE_URL
    description: Full Postgres URL. Compose from the RDS endpoint output + master password fetched from the Secrets Manager secret (aws secretsmanager get-secret-value).
  - name: LLM_KEY_ENCRYPTION_KEY
    description: Fernet key for tenant LLM API keys at rest. Losing it loses stored BYO keys.
    generate: python -c "import secrets; print(secrets.token_urlsafe(50))"
  - name: EMAIL_HOST_USER
    description: SES SMTP username (AKIA... form).
  - name: EMAIL_HOST_PASSWORD
    description: SES SMTP password.
  - name: SENTRY_DSN
    description: Sentry project DSN (blank disables).
  - name: BOOTSTRAP_PLATFORM_ADMIN_EMAIL
    description: First root admin email (migrate task creates it on first run).
  - name: BOOTSTRAP_PLATFORM_ADMIN_PASSWORD
    description: First root admin password — rotate immediately after first login; TOTP enrollment is forced.

plain_config:     # String parameters or Terraform variables (no secret values)
  - ALLOWED_HOSTS
  - CORS_ALLOWED_ORIGINS
  - CSRF_TRUSTED_ORIGINS
  - PUBLIC_BASE_URL
  - TRUSTED_PROXY_COUNT        # 1 (the ALB)
  - COOKIE_SECURE              # true
  - ENVIRONMENT                # production
  - REQUIRE_EMAIL_VERIFICATION # true
  - LLM_PROVIDER               # bedrock
  - BEDROCK_REGION
  - BEDROCK_MODEL
  - BEDROCK_EMBED_MODEL
  - EMBED_PROVIDER             # bedrock
  - EMBED_DIM                  # 1024 (titan v2) — matches migrations; changing requires re-embed
  - CACHE_URL                  # redis://...
  - CELERY_BROKER_URL          # redis://...
  - AWS_STORAGE_BUCKET_NAME
  - AWS_S3_REGION_NAME
  - DEFAULT_FROM_EMAIL
  - EMAIL_HOST
  - EMAIL_PORT
  - EMAIL_USE_TLS
  - LOG_FORMAT                 # json
  - LOG_LEVEL
  - ATTENDANCE_QR_REQUIRED     # true
