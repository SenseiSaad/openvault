# OpenVault — full local/production stack.
#   docker compose up -d                       # SQLite inside the api container
#   docker compose --profile pg up -d          # with PostgreSQL
#
# Secrets come from .env in THIS folder (never commit it).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # LLM: point at host Ollama or set GEMINI_API_KEY in .env
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:11434}
      # Postgres (only when the pg profile is used)
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: db
    volumes:
      - ov_data:/app/data
      - ov_media:/app/media
      - ov_db:/app/db
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openvault}
      POSTGRES_USER: ${POSTGRES_USER:-openvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvault}
    volumes:
      - ov_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openvault}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ov_data:
  ov_media:
  ov_db:
  ov_pgdata:
