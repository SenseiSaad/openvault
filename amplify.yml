version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node 20 required for Next.js 16
        - nvm use 20 || nvm install 20 && nvm use 20
        - node -v && npm -v
        # Install pnpm - corepack is broken on Amplify AL2023 (pnpm.cjs not found), so use npm global
        - npm install -g pnpm@12.3.4
        - pnpm --version
        - cd frontend && pnpm install --frozen-lockfile
    build:
      commands:
        - cd frontend && pnpm run build
  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
      - frontend/.next/cache/**/*
      - ~/.pnpm-store/**/*

