# Amplify Hosting build spec for the OpenVault monorepo.
#
# This repo is a monorepo (frontend/ = Next.js, backend/ = Django), so it MUST
# use the monorepo schema: `applications:` + `appRoot:`. With appRoot set,
# Amplify runs every command with the working directory already inside
# frontend/, so there is no `cd frontend` anywhere in this file and all paths
# below are relative to frontend/.
#
# The `appRoot` value must match the AMPLIFY_MONOREPO_APP_ROOT environment
# variable in the Amplify console (see AWS docs: "Configuring monorepo build
# settings"). Amplify sets that automatically when you tick
# "My app is a monorepo" and enter `frontend` as the app root.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Next.js 16 requires Node 20+.
            - nvm use 20 || nvm install 20 && nvm use 20
            - node -v && npm -v
            # pnpm is NOT bundled in the Amplify build image, so install it.
            # (corepack is broken on Amazon Linux 2023: pnpm.cjs MODULE_NOT_FOUND.)
            - npm install -g pnpm@12.3.4
            - pnpm --version
            # node-linker=hoisted is set in frontend/.npmrc, which Amplify's
            # Next.js SSR bundler requires for pnpm apps.
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pwd && ls -la | head -n 30
            - pnpm run build
      artifacts:
        # Relative to appRoot (frontend/). Amplify's Next.js SSR runtime reads
        # required-server-files.json from here.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
          - ~/.pnpm-store/**/*



