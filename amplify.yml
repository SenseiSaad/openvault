# Amplify static hosting for the Next.js frontend in this monorepo.
# The Django API and persistent data are deployed separately on Render.
version: 1
applications:
  - appRoot: frontend
    env:
      variables:
        AMPLIFY_MONOREPO_APP_ROOT: frontend
        AMPLIFY_STATIC_EXPORT: 'true'
        NEXT_PUBLIC_API_URL: https://api.saadops.site
    frontend:
      phases:
        preBuild:
          commands:
            # Next.js 16 needs a current Node runtime; pin Node 22 for builds.
            - nvm install 22
            - nvm use 22
            - npm install -g pnpm@12.3.4
            - pnpm install --frozen-lockfile
        build:
          commands:
            # Fail loudly if the runtime is unexpected, then build the static
            # site. Exports are repeated here so the Amplify console cannot
            # accidentally omit the API URL or produce an SSR .next build.
            - node --version
            - pnpm --version
            - export AMPLIFY_STATIC_EXPORT=true
            - export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://api.saadops.site}"
            - pnpm run build
            - test -f out/index.html
      artifacts:
        # Next 16 static export emits a complete site to frontend/out.
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
          - ~/.local/share/pnpm/store/**/*

